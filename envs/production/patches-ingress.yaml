- op: replace
  path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname
  value: essiantola.com
- op: replace
  path: /spec/rules/0/host
  value: essiantola.com
- op: replace
  path: /spec/tls/0/hosts/0
  value: essiantola.com
- op: add
  path: /spec/rules/0/http/paths/-
  value:
    path: /food-macro
    pathType: Prefix
    backend:
      service:
        name: food-macro-frontend-svc
        port:
          number: 80 
- op: add
  path: /spec/rules/0/http/paths/-
  value:
    path: /api
    pathType: Prefix
    backend:
      service:
        name: food-macro-api-svc
        port:
          number: 8080          
