---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/v1/
  - api-app/backend-deployment.yaml
  - api-app/service.yaml
  - api-app/sealed-secret.yaml
  - api-app/github-sealed-secret.yaml
  - api-app/frontend-deployment.yaml
  - api-app/frontend-service.yaml

patches:
  - target:
      kind: Ingress
      name: portfolio-ingress
    path: patches-ingress.yaml
