apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-macro-frontend
  namespace: staging-essi
  labels:
    app: food-macro-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-macro-frontend
  template:
    metadata:
      labels:
        app: food-macro-frontend
    spec:
      containers:
        - name: food-macro-frontend
          image: ezbaa/food-macro-api:frontend
          imagePullPolicy: Always
          # Static frontend; measured working set 3.0Mi.
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
          ports:
            - containerPort: 80
              name: http