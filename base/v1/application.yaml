apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: essi-app
  name: essi-app
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: essi-app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: essi-app
    spec:
      containers:
        - name: essi-app
          image: ezbaa/portfolio
          imagePullPolicy: Always
          # Static portfolio site; measured working set 3.1Mi. Requests exist
          # so the scheduler can see this pod and so it is not the first thing
          # evicted under node memory pressure.
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
          ports:
            - containerPort: 80
              name: portfolio-svc
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
